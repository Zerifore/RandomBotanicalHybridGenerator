<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=MV+Boli&display=swap" rel="stylesheet">
  <title>Random Plant Generator</title>
</head>
<body>
 <div class="container">
    <div class="title">Random Plant Generator</div>
    <div class="subtitle">~ by Zerifore ~</div>
    <div class="subtitle">* Over 325 Unique Plant Species!</div>

    <div class="button-container"><button onclick="generateAnimalWithAnimation(0)">Base / Habit</button><span class="number" id="num0"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(1)">Trunk / Stem (if applicable)</button><span class="number" id="num1"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(2)">Leaves</button><span class="number" id="num2"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(3)">Flower / Fertile Part</button><span class="number" id="num3"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(4)">Fruit / Seed (Pod)</button><span class="number" id="num4"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(5)">Roots</button><span class="number" id="num5"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(6)">Surface</button><span class="number" id="num6"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(7)">Foliage Color</button><span class="number" id="num7"></span></div>
    <div class="button-container"><button onclick="generateAnimalWithAnimation(8)">Bloom Color</button><span class="number" id="num8"></span></div>
    <div class="button-container"><button onclick="generateExtraWithAnimation(9)">Extra</button><span class="number" id="num9"></span></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
